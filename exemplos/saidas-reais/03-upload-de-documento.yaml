# Saida real, sem edicao manual. Entrada: exemplos/03-upload-de-documento.md
# Modelo: gemini-3.6-flash | Gerado em: 2026-11-11 | Auditoria: aprovado
requisito: Upload de documentos em processos por servidores com restrições de formato, tamanho, quantidade
  e situação do processo.
regras_identificadas:
- Só é possível anexar documento em processo com situação "Aberto".
- São aceitos os formatos PDF, PNG e JPG, com até 20 MB por arquivo.
- O sistema permite anexar até 10 arquivos por processo.
- Cada anexo registra data, hora e a matrícula do servidor que anexou.
- Ao tentar anexar o 11º arquivo, o sistema exibe "Limite de 10 anexos atingido".
- Anexo em processo com situação "Arquivado" é bloqueado com a mensagem "Processo arquivado não aceita
  novos anexos".
casos:
- id: CT-001
  titulo: Anexar documento em processo com situação Aberto
  tipo: sucesso
  prioridade: alta
  regra_coberta: Só é possível anexar documento em processo com situação "Aberto".
  pre_condicoes:
  - Existe um processo com situação 'Aberto'
  - Usuário autenticado como servidor
  passos:
  - acao: Acesse a tela do processo
    dado: Processo em situação 'Aberto'
  - acao: Selecione o arquivo para envio
    dado: documento.pdf (1 MB)
  - acao: Clique no botão Anexar
    dado: ''
  resultado_esperado: O arquivo documento.pdf é anexado com sucesso e exibido na lista de anexos do processo.
