# Saida real, sem edicao manual. Entrada: exemplos/02-login-por-perfil.md
# Modelo: gemini-3.6-flash | Gerado em: 2026-11-10 | Auditoria: aprovado
requisito: Controle de acesso e visualização de módulos no sistema por perfil de usuário.
regras_identificadas:
- O login é feito com e-mail e senha.
- Após três tentativas com senha incorreta, a conta é bloqueada por 15 minutos e exibe a mensagem "Conta
  temporariamente bloqueada".
- O perfil Operador vê somente o módulo Atendimento.
- O perfil Supervisor vê os módulos Atendimento e Relatórios.
- O perfil Administrador vê todos os módulos, incluindo Configurações.
- Usuário inativo não consegue entrar e recebe a mensagem "Usuário inativo".
- A sessão expira após 30 minutos sem interação e redireciona para a tela de login.
