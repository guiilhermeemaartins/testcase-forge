# Modelo: gemini-3.6-flash | Gerado em: 2026-11-10 | Auditoria: aprovado
requisito: Solicitação de alvará de funcionamento via portal por empreendedor autenticado
regras_identificadas:
- A solicitação só pode ser enviada por usuário autenticado com CNPJ ativo.
- O formulário exige CNPJ, endereço do estabelecimento, atividade principal (CNAE) e o anexo do contrato
  social em PDF de até 10 MB.
- Se o CNPJ informado estiver com situação diferente de ativa na base da Receita, o sistema bloqueia o
  envio e exibe a mensagem "CNPJ sem situação ativa".
- Anexo em formato diferente de PDF é rejeitado com a mensagem "Apenas arquivos PDF são aceitos".
- Anexo acima de 10 MB é rejeitado com a mensagem "Arquivo excede o limite de 10 MB".
- Ao enviar com sucesso, o sistema gera um número de protocolo no formato AAAA-NNNNNN e exibe esse número
  na tela de confirmação.
- A solicitação enviada fica com situação "Em análise" na lista de solicitações do usuário.
